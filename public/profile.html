<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — البريد</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.12); }
    body { background: var(--bg); color: #f5f0e8; font-family: 'Amiri', serif; margin: 0; }
    
    /* Header & Tabs */
    .header { background: var(--bg2); padding: 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .tabs { display: flex; gap: 20px; margin-top: 15px; }
    .tab { font-size: 0.9rem; color: #888; cursor: pointer; padding-bottom: 5px; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* List Items */
    .inbox-list { padding: 10px 0; padding-bottom: 80px; }
    .item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid var(--border); transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit; }
    .item:hover { background: rgba(201,168,76,0.03); }

    .avatar { width: 45px; height: 45px; border-radius: 50%; background: #1a1a17; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--gold); flex-shrink: 0; }
    .content { flex: 1; min-width: 0; }
    .title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .desc { font-size: 0.85rem; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--gold); opacity: 0.6; }

    /* Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--bg2); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-link { text-decoration: none; color: #666; font-size: 0.75rem; text-align: center; }
    .nav-link.active { color: var(--gold); }
  </style>
</head>
<body>

<div class="header">
  <div style="font-size: 1.3rem; font-weight: bold; color: var(--gold);">البريد</div>
  <div class="tabs">
    <div class="tab active" onclick="switchView('notifs', this)">تنبيهات</div>
    <div class="tab" onclick="switchView('msgs', this)">رسائل</div>
  </div>
</div>

<div class="inbox-list" id="mainList">
    </div>

<nav class="bottom-nav">
  <a href="feed.html" class="nav-link">🏠<br>الرئيسية</a>
  <a href="inbox.html" class="nav-link active">🔔<br>البريد</a>
  <a href="chat.html" class="nav-link">💬<br>الدردشة</a>
  <a href="profile.html" class="nav-link">👤<br>بروفايل</a>
</nav>

<script>
  const user = JSON.parse(localStorage.getItem('userData'));
  if (!user) window.location.href = 'index.html';

  async function loadInbox(type = 'notifs') {
    const list = document.getElementById('mainList');
    // Fetching data from your server.js API
    const res = await fetch(`/api/inbox?user=${user.user}&type=${type}`);
    const data = await res.json();

    if (data.length === 0) {
      list.innerHTML = `<div style="padding: 50px; text-align: center; color: #555;">لا توجد ${type === 'notifs' ? 'تنبيهات' : 'رسائل'} جديدة</div>`;
      return;
    }

    list.innerHTML = data.map(item => `
      <div class="item">
        <div class="avatar">${item.sender[0].toUpperCase()}</div>
        <div class="content">
          <div class="title">
            <span>${item.sender}</span>
            <span class="time">${item.time}</span>
          </div>
          <div class="desc">${item.text}</div>
        </div>
      </div>
    `).join('');
  }

  function switchView(type, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadInbox(type);
  }

  loadInbox('notifs');
</script>
</body>
</html>
