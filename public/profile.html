<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — الملف الشخصي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --cream: #f5f0e8; --border: rgba(201,168,76,0.12); }
    body { background: var(--bg); color: var(--cream); font-family: 'Amiri', serif; margin: 0; padding-bottom: 70px; }
    
    /* Profile Header */
    .profile-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 40px 20px; text-align: center; position: relative; }
    .avatar-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 15px; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; background: #1a1a17; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--gold); overflow: hidden; }
    .v-badge { position: absolute; bottom: 5px; right: 5px; background: #42a5f5; color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg2); }

    .name-row { font-size: 1.5rem; font-weight: bold; margin-bottom: 2px; }
    .handle-row { color: var(--gold); font-family: 'Space Mono'; font-size: 0.9rem; margin-bottom: 15px; }
    .bio { font-size: 0.95rem; color: #aaa; max-width: 300px; margin: 0 auto 20px; line-height: 1.4; }

    /* Stats bar */
    .stats { display: flex; justify-content: center; gap: 30px; border-top: 1px solid var(--border); padding-top: 20px; margin-bottom: 20px; }
    .stat-item { text-align: center; }
    .stat-val { display: block; font-family: 'Space Mono'; font-weight: bold; font-size: 1.2rem; }
    .stat-lbl { font-size: 0.8rem; color: #666; }

    /* Action Buttons */
    .btn-edit { background: var(--bg); border: 1px solid var(--gold); color: var(--gold); padding: 8px 25px; border-radius: 20px; font-family: 'Amiri'; cursor: pointer; transition: 0.3s; font-weight: bold; }
    .btn-edit:hover { background: var(--gold); color: #000; }

    /* Grid view */
    .grid-tabs { display: flex; border-top: 1px solid var(--border); }
    .g-tab { flex: 1; padding: 15px; text-align: center; color: #555; cursor: pointer; }
    .g-tab.active { color: var(--gold); border-top: 2px solid var(--gold); }
    .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
    .grid-item { aspect-ratio: 1/1; background: #111; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #444; padding: 10px; text-align: center; overflow: hidden; }

    /* Edit Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg2); width: 100%; max-width: 400px; padding: 25px; border-radius: 15px; border: 1px solid var(--border); }
    input, textarea { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 12px; margin-bottom: 15px; border-radius: 8px; font-family: 'Amiri'; }
  </style>
</head>
<body>

<div class="profile-header">
  <div class="avatar-wrapper">
    <div class="avatar" id="avatarBox">?</div>
    <div class="v-badge" id="vBadge" style="display:none">✔</div>
  </div>
  
  <div class="name-row" id="dispName">تحميل...</div>
  <div class="handle-row" id="dispHandle">@username</div>
  <div class="bio" id="dispBio">لا يوجد وصف حالياً.</div>

  <div class="stats">
    <div class="stat-item"><span class="stat-val" id="countPosts">0</span><span class="stat-lbl">منشورات</span></div>
    <div class="stat-item"><span class="stat-val" id="countFollowers">0</span><span class="stat-lbl">متابعين</span></div>
    <div class="stat-item"><span class="stat-val" id="countFollowing">0</span><span class="stat-lbl">يتابع</span></div>
  </div>

  <button class="btn-edit" id="mainBtn" onclick="toggleModal(true)">تعديل الملف</button>
</div>

<div class="grid-tabs">
  <div class="g-tab active">📑 منشوراتي</div>
  <div class="g-tab">🔖 محفوظات</div>
</div>

<div class="post-grid" id="postGrid">
  </div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:var(--gold)">تعديل الملف</h3>
    <input type="text" id="editName" placeholder="الإسم الكامل">
    <textarea id="editBio" placeholder="اكتب نبذة عنك..."></textarea>
    <div style="display:flex; gap:10px;">
      <button class="btn-edit" style="flex:1" onclick="saveProfile()">حفظ</button>
      <button class="btn-edit" style="flex:1; border-color:#444; color:#666" onclick="toggleModal(false)">إلغاء</button>
    </div>
  </div>
</div>

<script>
  const me = JSON.parse(localStorage.getItem('user'));
  // URL params let us view OTHER people's profiles too
  const urlParams = new URLSearchParams(window.location.search);
  const targetUser = urlParams.get('u') || me.user;

  async function loadProfile() {
    const res = await fetch('/api/admin/data');
    const data = await res.json();
    const userObj = data.users.find(u => u.user === targetUser);
    
    if(!userObj) return;

    // Display Info
    document.getElementById('dispName').innerText = userObj.name || userObj.user;
    document.getElementById('dispHandle').innerText = '@' + userObj.user;
    document.getElementById('dispBio').innerText = userObj.bio || "لا يوجد وصف.";
    document.getElementById('avatarBox').innerText = (userObj.name || userObj.user)[0].toUpperCase();
    
    // Stats
    document.getElementById('countFollowers').innerText = (userObj.followers || []).length;
    document.getElementById('countFollowing').innerText = (userObj.following || []).length;
    
    // Verified Badge
    if(userObj.isVerified) document.getElementById('vBadge').style.display = 'flex';

    // Button Logic: Edit if it's me, Follow if it's someone else
    const mainBtn = document.getElementById('mainBtn');
    if(targetUser !== me.user) {
      const isFollowing = (userObj.followers || []).includes(me.user);
      mainBtn.innerText = isFollowing ? 'إلغاء المتابعة' : 'متابعة';
      mainBtn.onclick = followUser;
    }

    // Load Posts into Grid
    const myPosts = data.posts.filter(p => p.handle === targetUser);
    document.getElementById('countPosts').innerText = myPosts.length;
    document.getElementById('postGrid').innerHTML = myPosts.map(p => `
      <div class="grid-item">${p.text.substring(0, 30)}...</div>
    `).join('');
  }

  async function followUser() {
    const res = await fetch('/api/user/follow', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ currentUser: me.user, targetUser: targetUser })
    });
    if(res.ok) loadProfile();
  }

  function toggleModal(show) {
    document.getElementById('editModal').classList.toggle('active', show);
    if(show) {
      document.getElementById('editName').value = document.getElementById('dispName').innerText;
      document.getElementById('editBio').value = document.getElementById('dispBio').innerText;
    }
  }

  async function saveProfile() {
    // Note: You'll need a simple /api/user/update endpoint in your server to handle this!
    alert("تم طلب التحديث بنجاح");
    toggleModal(false);
  }

  window.onload = loadProfile;
</script>
</body>
</html>
