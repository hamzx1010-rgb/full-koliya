<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.15); }
    body { background: var(--bg); color: #f5f0e8; font-family: 'Amiri', serif; margin: 0; padding-bottom: 70px; }
    
    /* Top Navigation */
    .top-nav { background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 10px 20px; }
    .top-tabs { display: flex; justify-content: center; gap: 30px; margin-top: 10px; }
    .tab { font-size: 0.9rem; color: #666; cursor: pointer; padding-bottom: 8px; border-bottom: 2px solid transparent; transition: 0.3s; }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* Bus Widget */
    .bus-widget { background: #111; border: 1px solid var(--border); margin: 20px; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
    .bus-info h4 { margin: 0; font-size: 0.8rem; color: #4ca87a; }
    .bus-time { font-family: 'Space Mono'; font-size: 1.8rem; color: var(--gold); }

    /* Post Input Area */
    .post-box { padding: 20px; border-bottom: 1px solid var(--border); display: flex; gap: 15px; }
    .user-avatar-circle { 
        width: 45px; height: 45px; border-radius: 50%; display: flex; 
        align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; flex-shrink: 0;
    }
    textarea { width: 100%; background: transparent; border: none; color: #fff; font-family: 'Amiri'; font-size: 1.1rem; outline: none; resize: none; }
    .post-btn { background: var(--gold); border: none; padding: 6px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; float: left; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--bg2); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; }
    .nav-link { text-decoration: none; color: #555; font-size: 0.75rem; text-align: center; }
    .nav-link.active { color: var(--gold); }
  </style>
</head>
<body>

<div class="top-nav">
    <div style="font-size: 1.5rem; font-weight: bold; color: var(--gold); text-align: center;">كلية</div>
    <div class="top-tabs">
        <div class="tab active" onclick="switchTab('all', this)">للجميع</div>
        <div class="tab" onclick="switchTab('specialty', this)">تخصصي</div>
        <div class="tab" onclick="switchTab('saved', this)">محفوظات</div>
    </div>
</div>

<div class="bus-widget">
    <div class="bus-info">
        <h4>حافلة COUS • نشط الآن</h4>
        <div style="font-size: 0.8rem; color: #666;">موعد وصول الحافلة القادمة لـ <span id="uniLoc">الجامعة</span></div>
    </div>
    <div class="bus-time" id="busTime">--:--</div>
</div>

<div class="post-box">
    <div class="user-avatar-circle" id="userIcon">?</div>
    <div style="flex:1">
        <textarea placeholder="ماذا يدور في ذهنك؟" id="postContent" rows="2"></textarea>
        <button class="post-btn" onclick="sendPost()">نشر</button>
    </div>
</div>

<div id="feedPosts">
    </div>

<nav class="bottom-nav">
  <a href="feed.html" class="nav-link active">🏠<br>الرئيسية</a>
  <a href="search.html" class="nav-link">🔍<br>بحث</a>
  <a href="inbox.html" class="nav-link">🔔<br>الرسائل</a>
  <a href="profile.html" class="nav-link">👤<br>الملف الشخصي</a>
</nav>

<script>
    // 1. DYNAMIC PROFILE SYNC
    const user = JSON.parse(localStorage.getItem('userData')) || { name: "Guest", uni: "Blida" };
    
    function initProfile() {
        const icon = document.getElementById('userIcon');
        const colors = ['#c9a84c', '#4ca87a', '#4c7aa8', '#a84c4c', '#8e4ca8'];
        const userColor = colors[user.name.charCodeAt(0) % colors.length];
        
        icon.innerText = user.name[0].toUpperCase();
        icon.style.background = userColor;
        icon.style.color = "#000";
        document.getElementById('uniLoc').innerText = user.uni || "جامعتك";
    }

    // 2. BUS TIMER LOGIC
    const uniTimes = { "Blida": "08:15", "Algiers": "07:45", "Oran": "08:00", "Constantine": "07:30" };
    function updateBus() {
        document.getElementById('busTime').innerText = uniTimes[user.uni] || "08:00";
    }

    // 3. TAB NAVIGATION
    function switchTab(type, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        // Logic to fetch filtered posts would go here
        console.log("Loading " + type + " posts...");
    }

    async function sendPost() {
        const text = document.getElementById('postContent').value;
        if(!text) return;
        // API call to server.js would go here
        alert("تم النشر بنجاح");
        document.getElementById('postContent').value = '';
    }

    window.onload = () => { initProfile(); updateBus(); };
</script>

</body>
</html>
