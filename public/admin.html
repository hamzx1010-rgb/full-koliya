<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — Owner Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --sidebar-w: 260px; --bg: #050505; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.15); }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: #fff; font-family: 'Amiri', serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: var(--sidebar-w); background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
    .sidebar-header { font-size: 1.5rem; font-weight: bold; color: var(--gold); margin-bottom: 40px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .nav-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; color: #888; transition: 0.3s; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
    .nav-item:hover, .nav-item.active { background: rgba(201,168,76,0.1); color: var(--gold); }
    .nav-item i { font-style: normal; font-size: 1.2rem; }

    /* Main Content */
    .main-view { flex: 1; overflow-y: auto; padding: 40px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--bg2); padding: 25px; border: 1px solid var(--border); border-radius: 15px; text-align: center; }
    .stat-val { font-family: 'Space Mono'; font-size: 2rem; color: var(--gold); display: block; }
    .stat-label { color: #666; font-size: 0.9rem; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; background: var(--bg2); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    th { background: #111; color: var(--gold); text-align: right; padding: 15px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    td { padding: 15px; border-bottom: 1px solid #1a1a17; font-size: 0.95rem; }
    .btn-action { padding: 5px 12px; border-radius: 5px; border: none; cursor: pointer; font-family: 'Amiri'; font-size: 0.85rem; }
    .approve-btn { background: #1b4d31; color: #7cfc00; margin-left: 5px; }
    .ban-btn { background: #4d1b1b; color: #ff4444; }

    .view-title { font-size: 1.8rem; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
    .badge-pending { background: #c9a84c; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-family: 'Space Mono'; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">Owner Mode</div>
  <div class="nav-item active" onclick="switchView('dashboard', this)"><i>📊</i> الإحصائيات</div>
  <div class="nav-item" onclick="switchView('requests', this)"><i>📥</i> الطلبات <span class="badge-pending" id="reqCount">0</span></div>
  <div class="nav-item" onclick="switchView('students', this)"><i>👥</i> الطلاب</div>
  <div class="nav-item" onclick="switchView('posts', this)"><i>📝</i> المنشورات</div>
  <div class="nav-item" onclick="switchView('system', this)"><i>⚙️</i> النظام</div>
  
  <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 20px;">
    <div class="nav-item" onclick="window.location.href='feed.html'" style="color: #fff;"><i>🏠</i> العودة للموقع</div>
  </div>
</div>

<div class="main-view">
  <div id="view-dashboard">
    <div class="view-title">نظرة عامة</div>
    <div class="stat-grid">
      <div class="stat-card"><span class="stat-val" id="totalUsers">0</span><span class="stat-label">إجمالي الطلاب</span></div>
      <div class="stat-card"><span class="stat-val" id="totalPosts">0</span><span class="stat-label">المنشورات</span></div>
      <div class="stat-card"><span class="stat-val" id="totalBanned">0</span><span class="stat-label">المحظورين</span></div>
    </div>
  </div>

  <div id="view-requests" style="display:none">
    <div class="view-title">طلبات الانضمام الجديدة</div>
    <table>
      <thead>
        <tr>
          <th>الطالب</th>
          <th>الجامعة / الولاية</th>
          <th>الحالة</th>
          <th>الإجراء</th>
        </tr>
      </thead>
      <tbody id="requestTable"></tbody>
    </table>
  </div>

  <div id="view-students" style="display:none">
    <div class="view-title">قائمة الطلاب المسجلين</div>
    <table>
      <thead>
        <tr>
          <th>الإسم</th>
          <th>إسم المستخدم</th>
          <th>الجامعة</th>
          <th>الإجراء</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>
</div>

<script>
  let dbData = { users: [], posts: [] };

  async function refreshData() {
    const res = await fetch('/api/admin/data');
    const data = await res.json();
    dbData = data;

    const pending = data.users.filter(u => u.status === 'pending');
    const active = data.users.filter(u => u.status === 'active');

    // Update Stats
    document.getElementById('totalUsers').innerText = active.length;
    document.getElementById('reqCount').innerText = pending.length;
    document.getElementById('totalPosts').innerText = data.posts.length;

    // Render Requests
    document.getElementById('requestTable').innerHTML = pending.map(u => `
      <tr>
        <td><b>${u.name}</b><br><small style="color:#666">@${u.user}</small></td>
        <td>${u.uni} (${u.wilaya})</td>
        <td><span style="color:var(--gold)">قيد الانتظار</span></td>
        <td>
          <button class="btn-action approve-btn" onclick="approveUser('${u.user}')">تفعيل</button>
          <button class="btn-action ban-btn" onclick="deleteUser('${u.user}')">رفض</button>
        </td>
      </tr>
    `).join('');

    // Render All Students
    document.getElementById('studentTable').innerHTML = active.map(u => `
      <tr>
        <td>${u.name}</td>
        <td>@${u.user}</td>
        <td>${u.uni}</td>
        <td>
          <button class="btn-action ban-btn" onclick="banUser('${u.user}')">حظر</button>
        </td>
      </tr>
    `).join('');
  }

  function switchView(viewId, el) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    document.getElementById('view-dashboard').style.display = 'none';
    document.getElementById('view-requests').style.display = 'none';
    document.getElementById('view-students').style.display = 'none';
    
    document.getElementById('view-' + viewId).style.display = 'block';
  }

  async function approveUser(username) {
    const res = await fetch('/api/admin/approve', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ targetUser: username })
    });
    if(res.ok) refreshData();
  }

  window.onload = refreshData;
</script>

</body>
</html>
