<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — Kulliya Owner</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --sidebar-w: 260px; --bg: #050505; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.15); }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: #fff; font-family: 'Amiri', serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Navigation */
    .sidebar { width: var(--sidebar-w); background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
    .sidebar-header { font-size: 1.5rem; font-weight: bold; color: var(--gold); margin-bottom: 40px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .nav-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; color: #888; transition: 0.3s; margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; }
    .nav-item:hover, .nav-item.active { background: rgba(201,168,76,0.1); color: var(--gold); }
    
    /* Notification Badge */
    .badge { background: var(--gold); color: #000; font-family: 'Space Mono'; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

    /* Main Area */
    .main-view { flex: 1; overflow-y: auto; padding: 40px; }
    .view-title { font-size: 1.8rem; margin-bottom: 30px; color: var(--gold); border-right: 4px solid var(--gold); padding-right: 15px; }

    /* Stats Grid */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--bg2); padding: 25px; border: 1px solid var(--border); border-radius: 15px; text-align: center; }
    .stat-val { font-family: 'Space Mono'; font-size: 2.2rem; color: var(--gold); display: block; }
    .stat-label { color: #666; font-size: 0.9rem; margin-top: 5px; }

    /* Tables */
    .table-container { background: var(--bg2); border: 1px solid var(--border); border-radius: 15px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #111; color: var(--gold); text-align: right; padding: 18px; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 18px; border-bottom: 1px solid #1a1a17; vertical-align: middle; }
    
    /* Buttons */
    .btn-group { display: flex; gap: 8px; }
    .btn-action { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-family: 'Amiri'; font-weight: bold; transition: 0.2s; }
    .approve-btn { background: #1b4d31; color: #7cfc00; }
    .approve-btn:hover { background: #24633f; }
    .ban-btn { background: #4d1b1b; color: #ff4444; }
    .ban-btn:hover { background: #632424; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">Owner Mode</div>
  <div class="nav-item active" id="nav-dash" onclick="switchView('dashboard')">
    <span>📊 الإحصائيات</span>
  </div>
  <div class="nav-item" id="nav-req" onclick="switchView('requests')">
    <span>📥 الطلبات</span>
    <span class="badge" id="reqBadge">0</span>
  </div>
  <div class="nav-item" id="nav-stud" onclick="switchView('students')">
    <span>👥 الطلاب</span>
  </div>
  
  <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 20px;">
    <a href="feed.html" class="nav-item" style="color: #fff;">🏠 العودة للموقع</a>
  </div>
</div>

<div class="main-view">
  <div id="view-dashboard">
    <div class="view-title">لوحة التحكم العامة</div>
    <div class="stat-grid">
      <div class="stat-card"><span class="stat-val" id="stat-active">0</span><span class="stat-label">طالب مفعل</span></div>
      <div class="stat-card"><span class="stat-val" id="stat-pending">0</span><span class="stat-label">طلبات معلقة</span></div>
      <div class="stat-card"><span class="stat-val" id="stat-posts">0</span><span class="stat-label">إجمالي المنشورات</span></div>
    </div>
  </div>

  <div id="view-requests" class="hidden">
    <div class="view-title">طلبات الانضمام الجديدة</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>الطالب</th>
            <th>الولاية / الجامعة</th>
            <th>تاريخ الطلب</th>
            <th>الإجراء</th>
          </tr>
        </thead>
        <tbody id="requestTable">
          </tbody>
      </table>
    </div>
  </div>

  <div id="view-students" class="hidden">
    <div class="view-title">إدارة الطلاب المسجلين</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>الإسم</th>
            <th>إسم المستخدم</th>
            <th>الجامعة</th>
            <th>الإجراء</th>
          </tr>
        </thead>
        <tbody id="studentTable">
          </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let cachedData = { users: [], posts: [] };

  async function loadData() {
    try {
      const res = await fetch('/api/admin/data');
      cachedData = await res.json();
      renderAll();
    } catch (err) {
      console.error("Critical error loading admin data:", err);
    }
  }

  function renderAll() {
    const pending = cachedData.users.filter(u => u.status === 'pending');
    const active = cachedData.users.filter(u => u.status === 'active');

    // Update Global UI
    document.getElementById('reqBadge').innerText = pending.length;
    document.getElementById('stat-active').innerText = active.length;
    document.getElementById('stat-pending').innerText = pending.length;
    document.getElementById('stat-posts').innerText = cachedData.posts.length;

    // Render Requests Table
    const reqBody = document.getElementById('requestTable');
    if (pending.length === 0) {
      reqBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#555; padding:40px;">لا توجد طلبات جديدة</td></tr>`;
    } else {
      reqBody.innerHTML = pending.map(u => `
        <tr>
          <td><b style="color:var(--gold)">${u.name}</b><br><small>@${u.user}</small></td>
          <td>${u.wilaya} / ${u.uni}</td>
          <td style="font-family:'Space Mono'; font-size:0.8rem;">${new Date(u.joinedAt).toLocaleDateString('en-GB')}</td>
          <td>
            <div class="btn-group">
              <button class="btn-action approve-btn" onclick="updateStatus('${u.user}', 'active')">تفعيل</button>
              <button class="btn-action ban-btn" onclick="updateStatus('${u.user}', 'rejected')">رفض</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Render Students Table
    const studBody = document.getElementById('studentTable');
    studBody.innerHTML = active.map(u => `
      <tr>
        <td>${u.name}</td>
        <td>@${u.user}</td>
        <td>${u.uni}</td>
        <td>
          <button class="btn-action ban-btn" onclick="updateStatus('${u.user}', 'banned')">حظر</button>
        </td>
      </tr>
    `).join('');
  }

  function switchView(viewId) {
    // Nav Items
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    if (viewId === 'dashboard') document.getElementById('nav-dash').classList.add('active');
    if (viewId === 'requests') document.getElementById('nav-req').classList.add('active');
    if (viewId === 'students') document.getElementById('nav-stud').classList.add('active');

    // Section Visibility
    document.getElementById('view-dashboard').classList.add('hidden');
    document.getElementById('view-requests').classList.add('hidden');
    document.getElementById('view-students').classList.add('hidden');
    document.getElementById('view-' + viewId).classList.remove('hidden');
  }

  async function updateStatus(username, newStatus) {
    const res = await fetch('/api/admin/approve', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ targetUser: username, status: newStatus })
    });
    if (res.ok) loadData();
  }

  window.onload = loadData;
</script>

</body>
</html>
