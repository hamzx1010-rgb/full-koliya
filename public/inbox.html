<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — الرسائل</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.12); }
    body { background: var(--bg); color: #f5f0e8; font-family: 'Amiri', serif; margin: 0; }
    
    /* Header & Telegram-style Tabs */
    .header { background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .inbox-title { padding: 15px 20px; font-size: 1.3rem; font-weight: bold; color: var(--gold); }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 12px; font-size: 0.9rem; color: #666; cursor: pointer; transition: 0.3s; }
    .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); background: rgba(201,168,76,0.05); }

    /* List Design */
    .inbox-list { padding-bottom: 80px; }
    .chat-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid #141411; text-decoration: none; color: inherit; transition: 0.2s; }
    .chat-item:active { background: #1a1a17; }
    
    .avatar { 
        width: 55px; height: 55px; border-radius: 50%; display: flex; 
        align-items: center; justify-content: center; font-size: 1.2rem; 
        font-weight: bold; color: #000; flex-shrink: 0; 
    }
    
    .chat-info { flex: 1; min-width: 0; }
    .chat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .chat-name { font-weight: bold; font-size: 1rem; }
    .chat-time { font-family: 'Space Mono'; font-size: 0.7rem; color: #555; }
    .chat-msg { font-size: 0.85rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .unread-badge { background: var(--gold); color: #000; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

    /* Navigation */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--bg2); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-link { text-decoration: none; color: #555; font-size: 0.75rem; text-align: center; }
    .nav-link.active { color: var(--gold); }
  </style>
</head>
<body>

<div class="header">
  <div class="inbox-title">الرسائل</div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('chats', this)">الدردشات</div>
    <div class="tab" onclick="switchTab('channels', this)">القنوات</div>
    <div class="tab" onclick="switchTab('requests', this)">طلبات</div>
  </div>
</div>

<div class="inbox-list" id="inboxList">
    </div>

<nav class="bottom-nav">
  <a href="feed.html" class="nav-link">🏠<br>الرئيسية</a>
  <a href="search.html" class="nav-link">🔍<br>بحث</a>
  <a href="inbox.html" class="nav-link active">🔔<br>الرسائل</a>
  <a href="profile.html" class="nav-link">👤<br>بروفايل</a>
</nav>

<script>
  const user = JSON.parse(localStorage.getItem('userData'));
  const colors = ['#c9a84c', '#4ca87a', '#4c7aa8', '#a84c4c', '#8e4ca8'];

  const mockData = {
    chats: [
      { id: 1, name: "Sarah Ecology", msg: "هل بدأت في مراجعة الإحصاء؟", time: "12:45 PM", unread: 2 },
      { id: 2, name: "Ahmed L3", msg: "الملفات موجودة في مكتبة الكلية", time: "Yesterday", unread: 0 }
    ],
    channels: [
      { id: 101, name: "أخبار جامعة البليدة", msg: "تحديث: تم تغيير مواقيت النقل غداً", time: "10:00 AM", unread: 0 },
      { id: 102, name: "Ecology_DZ Official", msg: "نتائج المسابقة متوفرة الآن", time: "May 09", unread: 5 }
    ],
    requests: [
      { id: 201, name: "User_884", msg: "يريد بدء محادثة معك", time: "2h ago", unread: 0 }
    ]
  };

  function switchTab(type, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderList(type);
  }

  function renderList(type) {
    const list = document.getElementById('inboxList');
    const items = mockData[type];

    if (items.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:50px; color:#444;">لا يوجد محتوى هنا بعد</div>`;
        return;
    }

    list.innerHTML = items.map(item => {
      const color = colors[item.name.charCodeAt(0) % colors.length];
      return `
        <a href="chat.html?id=${item.id}" class="chat-item">
          <div class="avatar" style="background:${color}">${item.name[0].toUpperCase()}</div>
          <div class="chat-info">
            <div class="chat-top">
              <span class="chat-name">${item.name}</span>
              <span class="chat-time">${item.time}</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="chat-msg">${item.msg}</span>
                ${item.unread > 0 ? `<span class="unread-badge">${item.unread}</span>` : ''}
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  // Load chats by default
  window.onload = () => renderList('chats');
</script>

</body>
</html>
