<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — البريد</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.12); }
    body { background: var(--bg); color: #fff; font-family: 'Amiri', serif; margin: 0; }
    
    .header { padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 15px; }
    .back-btn { text-decoration: none; color: var(--gold); font-size: 1.2rem; }

    .inbox-item { 
      display: flex; align-items: center; padding: 15px 20px; 
      border-bottom: 1px solid var(--border); text-decoration: none; color: #fff;
      transition: 0.2s;
    }
    .inbox-item:hover { background: rgba(251, 168, 76, 0.03); }
    
    .avatar { 
      width: 50px; height: 50px; border-radius: 50%; background: #1a1a17; 
      border: 1px solid var(--gold); display: flex; align-items: center; 
      justify-content: center; font-weight: bold; margin-left: 15px;
    }
    
    .content { flex: 1; }
    .name { font-weight: bold; font-size: 1rem; display: flex; justify-content: space-between; }
    .time { font-size: 0.7rem; color: #555; }
    .preview { font-size: 0.85rem; color: #888; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    
    .unread-dot { width: 8px; height: 8px; background: var(--gold); border-radius: 50%; }
  </style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn">→</a>
  <h2 style="margin:0; font-size:1.3rem;">الرسائل</h2>
</div>

<div id="inboxList">
  </div>

<script>
  const me = JSON.parse(localStorage.getItem('user'));

  async function loadInbox() {
    const res = await fetch('/api/admin/data'); // In a full app, we'd have a specific /api/messages
    const data = await res.json();
    
    // For this prototype, we'll show other active users as potential chats
    const otherUsers = data.users.filter(u => u.user !== me.user && u.status === 'active');
    
    document.getElementById('inboxList').innerHTML = otherUsers.map(u => `
      <a href="chat.html?u=${u.user}" class="inbox-item">
        <div class="avatar">${u.name[0]}</div>
        <div class="content">
          <div class="name">
            <span>${u.name} ${u.isVerified ? '✔️' : ''}</span>
            <span class="time">12:45 م</span>
          </div>
          <div class="preview">اضغط لبدء المحادثة مع @${u.user}</div>
        </div>
        <div class="unread-dot"></div>
      </a>
    `).join('');
  }

  window.onload = loadInbox;
</script>
</body>
</html>
