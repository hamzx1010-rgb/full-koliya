<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — Owner</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --sidebar-w: 260px; --bg: #050505; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.15); }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: #fff; font-family: 'Amiri', serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Navigation */
    .sidebar { width: var(--sidebar-w); background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
    .sidebar-header { font-size: 1.5rem; font-weight: bold; color: var(--gold); margin-bottom: 40px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .nav-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; color: #888; transition: 0.3s; margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; }
    .nav-item:hover, .nav-item.active { background: rgba(201,168,76,0.1); color: var(--gold); }
    
    /* Main Content */
    .main-view { flex: 1; overflow-y: auto; padding: 40px; }
    .view-title { font-size: 1.8rem; margin-bottom: 30px; color: var(--gold); display: flex; justify-content: space-between; align-items: center; }

    /* Bus Control Cards */
    .bus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .bus-card { background: var(--bg2); padding: 20px; border: 1px solid var(--border); border-radius: 12px; }
    .bus-card input { background: #000; border: 1px solid #333; color: var(--gold); padding: 8px; border-radius: 5px; width: 100px; font-family: 'Space Mono'; }

    /* Tables & Buttons */
    table { width: 100%; border-collapse: collapse; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; }
    th { text-align: right; padding: 15px; background: #111; color: var(--gold); font-size: 0.8rem; }
    td { padding: 15px; border-bottom: 1px solid #1a1a17; }
    
    .btn-action { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Amiri'; font-weight: bold; }
    .btn-verify { background: #1e3a5f; color: #42a5f5; margin-left: 5px; }
    .btn-ban { background: #4d1b1b; color: #ff4444; }
    .btn-save { background: var(--gold); color: #000; margin-top: 10px; width: 100%; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">Owner Mode</div>
  <div class="nav-item active" onclick="switchView('users', this)"><span>👥 إدارة المستخدمين</span></div>
  <div class="nav-item" onclick="switchView('bus', this)"><span>🚌 توقيت الكوس (COUS)</span></div>
  <div class="nav-item" onclick="switchView('posts', this)"><span>📝 الرقابة والمنشورات</span></div>
  <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 20px;">
    <div class="nav-item" onclick="window.location.href='index.html'" style="color: #fff;"><span>🏠 العودة للموقع</span></div>
  </div>
</div>

<div class="main-view">
  <div id="view-users">
    <div class="view-title">قائمة الطلاب</div>
    <table>
      <thead>
        <tr>
          <th>الطالب</th>
          <th>الولاية / الجامعة</th>
          <th>الحالة</th>
          <th>الإجراء</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>

  <div id="view-bus" class="hidden">
    <div class="view-title">توقيت حافلات COUS حسب الولاية</div>
    <div class="bus-grid" id="busGrid">
      </div>
  </div>

  <div id="view-posts" class="hidden">
    <div class="view-title">إدارة المنشورات</div>
    <div id="adminPosts"></div>
  </div>
</div>

<script>
  async function loadAdminData() {
    const res = await fetch('/api/admin/data');
    const data = await res.json();
    
    // Render Users
    document.getElementById('userTable').innerHTML = data.users.map(u => `
      <tr>
        <td><b>${u.name}</b> ${u.isVerified ? '✅' : ''}<br><small>@${u.user}</small></td>
        <td>${u.wilaya} / ${u.uni}</td>
        <td>${u.status === 'banned' ? '🚫 محظور' : '✅ نشط'}</td>
        <td>
          <button class="btn-action btn-verify" onclick="userAction('${u.user}', 'verify')">توثيق</button>
          <button class="btn-action btn-ban" onclick="userAction('${u.user}', 'ban')">${u.status === 'banned' ? 'إلغاء الحظر' : 'حظر'}</button>
        </td>
      </tr>
    `).join('');

    // Render Bus Control
    const wilayas = ["البليدة", "الجزائر", "تيبازة", "المدية", "بومرداس"];
    document.getElementById('busGrid').innerHTML = wilayas.map(w => `
      <div class="bus-card">
        <h3 style="margin:0 0 10px 0">${w}</h3>
        <label>وقت الوصول:</label>
        <input type="text" id="bus-${w}" value="${data.busSchedules?.[w] || '08:00'}" placeholder="00:00">
        <button class="btn-action btn-save" onclick="updateBus('${w}')">تحديث التوقيت</button>
      </div>
    `).join('');

    // Render Posts
    document.getElementById('adminPosts').innerHTML = data.posts.map(p => `
      <div style="background:#0e0e0b; padding:15px; border:1px solid #222; margin-bottom:10px; border-radius:8px;">
        <div style="display:flex; justify-content:space-between;">
          <b>${p.author} (@${p.handle})</b>
          <button class="btn-action btn-ban" onclick="deletePost(${p.id})">حذف المنشور</button>
        </div>
        <p style="color:#888">${p.text}</p>
      </div>
    `).join('');
  }

  function switchView(viewId, el) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('view-users').classList.add('hidden');
    document.getElementById('view-bus').classList.add('hidden');
    document.getElementById('view-posts').classList.add('hidden');
    document.getElementById('view-' + viewId).classList.remove('hidden');
  }

  async function updateBus(wilaya) {
    const time = document.getElementById(`bus-${wilaya}`).value;
    await fetch('/api/admin/bus-update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ wilaya, time })
    });
    alert(`تم تحديث توقيت ${wilaya}`);
  }

  async function userAction(targetUser, action) {
    await fetch('/api/admin/user-action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ targetUser, action })
    });
    loadAdminData();
  }

  async function deletePost(id) {
    if(confirm("حذف هذا المنشور نهائياً؟")) {
      await fetch(`/api/admin/post/${id}`, { method: 'DELETE' });
      loadAdminData();
    }
  }

  window.onload = loadAdminData;
</script>
</body>
</html>
