<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.15); --cream: #f5f0e8; }
    body { background: var(--bg); color: var(--cream); font-family: 'Amiri', serif; margin: 0; padding-bottom: 80px; }

    /* Top Nav - Instagram Style */
    .header-main { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 15px 20px; background: var(--bg2); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 1000;
    }
    .brand { font-size: 1.6rem; font-weight: bold; color: var(--gold); text-decoration: none; }
    .inbox-link { font-size: 1.5rem; text-decoration: none; position: relative; }

    /* Categories Tab */
    .tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 0.9rem; color: #666; transition: 0.3s; }
    .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); background: rgba(201,168,76,0.02); }

    /* Floating Post Button (FAB) */
    .fab-plus {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--gold); width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; color: #000; border: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(201,168,76,0.4); z-index: 1001;
    }

    /* Post Styling */
    .post { padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg2); margin-bottom: 1px; }
    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1a1a17; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--gold); }
    .verified-badge { color: #42a5f5; font-size: 0.8rem; margin-right: 4px; }
    
    /* Post Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: var(--bg2); width: 100%; max-width: 500px; border-radius: 15px; border: 1px solid var(--border); padding: 20px; }
    textarea { width: 100%; height: 150px; background: transparent; border: none; color: #fff; font-size: 1.1rem; resize: none; outline: none; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="header-main">
  <a href="#" class="brand">كلية</a>
  <a href="inbox.html" class="inbox-link">✉️</a>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('all', this)">للجميع</div>
  <div class="tab" onclick="switchTab('uni', this)">جامعتي</div>
  <div class="tab" onclick="switchTab('saved', this)">محفوظات</div>
</div>

<div id="feed">
  </div>

<button class="fab-plus" onclick="toggleModal(true)">+</button>

<div class="modal" id="postModal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <span style="color:var(--gold); font-weight:bold;">منشور جديد</span>
      <button onclick="toggleModal(false)" style="background:none; border:none; color:#888; font-size:1.5rem;">×</button>
    </div>
    <textarea id="postInput" placeholder="ماذا يدور في ذهنك؟"></textarea>
    <button onclick="submitPost()" style="width:100%; background:var(--gold); padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">نشر</button>
  </div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user')) || { name: 'طالب', user: 'guest' };

  async function loadFeed(filter = 'all') {
    const res = await fetch('/api/admin/data'); // Fetching all data
    const data = await res.json();
    const feed = document.getElementById('feed');
    
    feed.innerHTML = data.posts.map(p => `
      <div class="post">
        <div class="post-header">
          <div class="user-avatar">${p.author[0]}</div>
          <div>
            <div style="font-weight:bold;">${p.author} ${p.isVerified ? '<span class="verified-badge">✔</span>' : ''}</div>
            <div style="font-size:0.7rem; color:#666;">@${p.handle}</div>
          </div>
        </div>
        <p style="line-height:1.6; margin-bottom:15px;">${p.text}</p>
        <div style="display:flex; gap:20px; color:var(--gold); font-size:0.9rem;">
          <span onclick="likePost(${p.id})">❤ ${p.likes.length || 0}</span>
          <span onclick="openComments(${p.id})">💬 ${p.comments.length || 0}</span>
          <span onclick="savePost(${p.id})">🔖 حفظ</span>
        </div>
      </div>
    `).join('');
  }

  function toggleModal(show) {
    document.getElementById('postModal').classList.toggle('active', show);
  }

  async function submitPost() {
    const text = document.getElementById('postInput').value;
    if(!text.trim()) return;

    const res = await fetch('/api/post', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ 
        text, 
        author: user.name, 
        userHandle: user.user 
      })
    });

    if(res.ok) {
      document.getElementById('postInput').value = '';
      toggleModal(false);
      loadFeed();
    }
  }

  function switchTab(type, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadFeed(type);
  }

  window.onload = () => loadFeed('all');
</script>
</body>
</html>
