<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلية — دخول</title>
    <style>
        body { background: #0a0a08; color: #f5f0e8; font-family: 'Amiri', serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #0e0e0b; padding: 30px; border: 1px solid rgba(201,168,76,0.1); width: 100%; max-width: 350px; border-radius: 12px; text-align: center; }
        h2 { color: #c9a84c; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #131310; border: 1px solid #c9a84c33; color: #fff; border-radius: 5px; box-sizing: border-box; }
        input:focus { border-color: #c9a84c; outline: none; }
        button { width: 100%; padding: 12px; background: #c9a84c; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #e0bc5a; }
        .toggle { margin-top: 15px; font-size: 0.8rem; color: #888; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>منصة كلية</h2>
    <div id="loginForm">
        <input id="user" placeholder="اسم المستخدم">
        <input id="pass" type="password" placeholder="كلمة السر">
        <button onclick="handleLogin()">دخول</button>
        <div class="toggle">ليس لديك حساب؟ سجل الآن</div>
    </div>
</div>

<script>
    async function handleLogin() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });

        const data = await res.json();

        if (data.success) {
            // Save user data to session
            localStorage.setItem('user', JSON.stringify(data.user));

            // CRITICAL REDIRECT LOGIC
            if (data.user.role === 'admin') {
                window.location.href = 'admin.html'; // Go to secret admin panel
            } else {
                window.location.href = 'feed.html';  // Go to student feed
            }
        } else {
            alert("خطأ في اسم المستخدم أو كلمة السر");
        }
    }
</script>
</body>
</html>
