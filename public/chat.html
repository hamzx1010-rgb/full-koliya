<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دردشة</title>
  <style>
    :root { --bg: #000; --bg2: #0e0e0b; --gold: #c9a84c; }
    body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    .chat-header { padding: 15px; background: var(--bg2); border-bottom: 1px solid #222; display: flex; align-items: center; gap: 15px; }
    .back-btn { text-decoration: none; color: var(--gold); font-size: 1.5rem; }

    .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    
    .bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; position: relative; }
    .bubble.me { align-self: flex-end; background: #333; color: #fff; border-bottom-right-radius: 4px; }
    .bubble.them { align-self: flex-start; background: var(--gold); color: #000; border-bottom-left-radius: 4px; }

    .input-area { padding: 15px; background: var(--bg2); display: flex; gap: 10px; align-items: center; }
    input { flex: 1; background: #1a1a17; border: 1px solid #333; padding: 12px; border-radius: 25px; color: #fff; outline: none; }
    .send-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gold); }
  </style>
</head>
<body>

<div class="chat-header">
  <a href="inbox.html" class="back-btn">→</a>
  <div id="chatPartner" style="font-weight:bold;">جاري التحميل...</div>
</div>

<div class="messages-area" id="chatBox">
  <div class="bubble them">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
  <div class="bubble me">أهلاً، كنت أبحث عن ملخصات مادة الإيكولوجيا.</div>
</div>

<div class="input-area">
  <button style="background:none; border:none; font-size:1.2rem;">📷</button>
  <input type="text" id="msgInput" placeholder="اكتب رسالة...">
  <button class="send-btn" onclick="sendMsg()">🕊️</button>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const partner = urlParams.get('u');
  document.getElementById('chatPartner').innerText = '@' + partner;

  function sendMsg() {
    const input = document.getElementById('msgInput');
    if(!input.value.trim()) return;

    const div = document.createElement('div');
    div.className = 'bubble me';
    div.innerText = input.value;
    document.getElementById('chatBox').appendChild(div);
    
    input.value = '';
    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
  }
</script>
</body>
</html>
