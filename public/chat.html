<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلية — الدردشة</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a08; --bg2: #0e0e0b; --gold: #c9a84c; --border: rgba(201,168,76,0.15); }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: #fff; font-family: 'Amiri', serif; margin: 0; overflow: hidden; }
    
    .chat-container { display: flex; flex-direction: column; height: 100vh; }
    
    /* Header */
    .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 15px; }
    .back-btn { text-decoration: none; color: var(--gold); font-size: 1.2rem; }
    
    /* Messages Area */
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; position: relative; }
    .me { align-self: flex-end; background: #222; color: #fff; border-bottom-right-radius: 4px; border: 1px solid var(--border); }
    .them { align-self: flex-start; background: var(--gold); color: #000; border-bottom-left-radius: 4px; }
    
    /* Input Area */
    .input-area { padding: 15px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .media-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; filter: grayscale(1); }
    .chat-input { flex: 1; background: #000; border: 1px solid #333; border-radius: 25px; padding: 10px 20px; color: #fff; outline: none; font-family: 'Amiri'; }
    .chat-input:focus { border-color: var(--gold); }
    .send-btn { background: var(--gold); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <a href="feed.html" class="back-btn">→</a>
        <div style="font-weight: bold;">غرفة الدردشة العامة</div>
    </div>

    <div class="messages" id="chatBox">
        <div class="bubble them">مرحباً بك في دردشة "كلية"! تذكر الالتزام بقوانين الجامعة.</div>
    </div>

    <div class="input-area">
        <button class="media-btn">📷</button>
        <input type="text" id="msgInput" class="chat-input" placeholder="اكتب رسالة..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendMessage()">⬆</button>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('userData'));
    if (!user) window.location.href = 'index.html';

    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        // Create UI Bubble for "Me"
        const myMsg = document.createElement('div');
        myMsg.className = 'bubble me';
        myMsg.textContent = text;
        chatBox.appendChild(myMsg);

        // Clear and Scroll
        msgInput.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Note: Real-time sync would require WebSockets, 
        // but this connects to the general UI flow for now.
    }
</script>

</body>
</html>
